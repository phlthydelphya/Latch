.container {

@media (min-width: 768px) {

/* Button Variants */
.btn {
  display: inline-flex;

  justify-content: center;

  border-radius: var(--radius);
  font-weight: 600;
  font-size: 0.9375rem;
  transition: all var(--transition);
  white-space: nowrap;
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--accent);
  color: var(--bg);
}

.btn-primary:hover:not(:disabled) {

}

.btn-secondary {
  background: var(--bg-elevated);
  color: var(--fg);
  border: 1px solid var(--border);

.btn-secondary:hover:not(:disabled) {
  background: var(--border);
  border-color: var(--fg-muted);

.btn-danger {
  background: var(--danger);
  color: white;

.btn-danger:hover:not(:disabled) {

.btn-ghost {

.btn-ghost:hover:not(:disabled) {

.btn-icon {

/* Form Elements */
.input-group {
  display: flex;
  flex-direction: column;
  gap: 0.375rem;
}

.input-label {
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--fg-muted);
}

.input-field {
  padding: 0.75rem 1rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: border-color var(--transition), box-shadow var(--transition);
}

.input-field:hover {
  border-color: var(--fg-muted);

.input-field:focus {

  box-shadow: 0 0 0 3px rgba(0, 212, 170, 0.15);

.input-field::placeholder {
  color: var(--fg-muted);
  opacity: 0.5;
}

.input-field:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* Media Toggle Buttons */
.media-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--fg);
  transition: all var(--transition);
}

.media-toggle:hover:not(:disabled) {
  background: var(--border);
  transform: scale(1.05);
}

.media-toggle.active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--bg);
}

.media-toggle.muted {
  background: var(--danger);
  border-color: var(--danger);
  color: white;
}

.media-toggle.muted:hover:not(:disabled) {
  background: var(--danger-hover);
}

.media-toggle svg {
  width: 24px;
  height: 24px;
}

/* Video Grid */
.video-grid {
  display: grid;
  gap: 0.5rem;
  width: 100%;
  height: 100%;
}

.video-grid--1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
.video-grid--2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
.video-grid--3,
.video-grid--4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.video-grid--5,
.video-grid--6 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; }
.video-grid--7,
.video-grid--8,
.video-grid--9 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }

.video-tile {

  border-radius: var(--radius);

  border: 1px solid var(--border);

  font-size: 0.75rem;
  font-weight: 500;
  backdrop-filter: blur(4px);

.video-tile__indicators {
  position: absolute;
  top: 0.5rem;
  right: 0.5rem;
  display: flex;
  gap: 0.25rem;

.video-tile__indicator {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--danger);
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.video-tile__indicator--screen {
  background: var(--warning);
  animation: none;
}

.video-tile--local {
  border-color: var(--accent);

.video-tile--local .video-tile__label::after {

  color: var(--accent);
}

.shield-badge {

  gap: 0.375rem;

  border-radius: 999px;

  height: 14px;

.preview-video video {

.landing {

.error-boundary__title {

.pwa-update-prompt__content {

}

.pwa-update-prompt__icon {

@media print {
  .control-bar,
  .media-toggle,
  .shield-badge,
  .pwa-update-prompt {
