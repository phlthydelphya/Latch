apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meet-secure-core-ingress
  namespace: meet-secure
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # Link the ingress directly to your self-signed cluster issuer
    cert-manager.io/cluster-issuer: "selfsigned-issuer"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "meet-signal"
spec:
  tls:
  - hosts:
    - meet.securecore.local
    secretName: meet-secure-core-tls
  rules:
  - host: meet.securecore.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: meet-signal
            port:
              number: 80
