# LiveKit 1.25 — P0 single-SFU, Redis, SFrame blind-forward
# Ref: docs/architecture-brief.md §5/9, docs/adr/ADR-004-livekit-vs-mediasoup.md, docs/adr/ADR-002-sframe-pivot-criteria.md
# Status: REVIEW REQUIRED — validated via `docker compose -f infra/compose.yaml up --build --wait`
port: 7880
rtc:
  port_range_start: 40000
  port_range_end: 40200
  tcp_port: 7881
  # Single UDP mux port — Docker Desktop UDP forwarding for a 201-port range is
  # unreliable (Firefox STUN binding requests to 127.0.0.1:4xxxx never arrive at
  # the container). Single-port forwarding is the proven local-dev path.
  udp_port: 7882
  use_external_ip: false
  # Local dev: advertise loopback so browsers on the Docker host can reach candidates.
  # Without this, LiveKit advertises its container bridge IP (172.x.x.x) which is
  # unreachable from the host browser, causing ICE failure (Firefox has no ICE-TCP
  # fallback like Chromium). Prod/K8s must override with the real node IP.
  node_ip: 127.0.0.1
  # Single-host P0; K8s uses hostNetwork or NodePort via Helm
redis:
  address: redis:6379
  username: ""
  password: ""
  db: 0
keys:
  # Injected via LIVEKIT_KEYS env; placeholder for yaml lint
  dev: dev-secret-32chars-at-least
room:
  auto_create: true
  enabled_codecs:
    - mime: video/VP9
    - mime: video/H264
    - mime: audio/opus
  max_participants: 20
  empty_timeout: 300 # 5min
  departure_timeout: 20
turn:
  # Local dev: embedded TURN ON. coturn (network_mode: host) is unreachable from
  # the Windows host browser (isolated in WSL2 VM), so clients got NO relay
  # candidates and Firefox (no ICE-TCP active fallback) had no viable path.
  # Embedded TURN advertises turn:<node_ip>:3478 with per-participant ephemeral
  # creds in the join response; relay ports reuse the mapped 40000-40200 range.
  # Prod topology keeps external coturn per architecture-brief §7.
  enabled: true
  # Use 127.0.0.1 instead of turn.meet-secure.local so the Windows host can resolve it
  domain: 127.0.0.1
  tls_port: 0
  # 3478 + 3479 are held by coturn (host networking: listening + alt ports) inside
  # the same VM as Docker's port proxy — use 3480 for embedded TURN.
  udp_port: 3480
  relay_range_start: 40000
  relay_range_end: 40200
logging:
  level: info
  json: true
  # Privacy: no PII/SDP in SFU logs
prometheus:
  port: 9600
# E2EE is client-enforced (SFrame RFC9605 via Insertable Streams/wasm-sframe) — server opaque, no key material
# Proof: packet-level (Wireshark pcap on meet-secure-p0_default bridge, tshark rtp && sframe shows ciphertext, no plaintext NALs)
# LIVEKIT_E2EE_* env in compose is advisory only — packet proof required per D-036
# HA: liveness via :9600/healthz every 5s (see infra/compose.yaml healthcheck)
# Scale tier: ≤20p single SFU, 2 vCPU/4g (or 1 vCPU/2g marginal per ADR-004 benchmark CPU 48% avg, 66.8% p95)
